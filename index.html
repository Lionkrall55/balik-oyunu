<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Sea Pro - V1.1 Official</title>
    <!-- Profesyonel Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2fe; --gold: #ffd700; --deep: #000205; --purple: #a855f7; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        canvas { display: block; }

        /* Üst Panel */
        .header {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            display: flex; justify-content: space-around; padding: 20px 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,242,254,0.1);
        }
        .stat { text-align: center; }
        .val { display: block; font-size: 20px; font-weight: 900; color: var(--gold); }
        .lbl { font-size: 9px; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }

        /* Kasa Çubuğu */
        .vault-ui {
            position: absolute; top: 90px; left: 15px; right: 15px; z-index: 100;
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px;
            display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .v-bar { flex-grow: 1; height: 6px; background: #000; border-radius: 3px; margin: 0 12px; overflow: hidden; }
        .v-fill { width: 0.1%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); box-shadow: 0 0 10px var(--gold); }

        /* Butonlar */
        .action-hub { position: absolute; bottom: 120px; width: 100%; text-align: center; z-index: 100; }
        .cast-btn {
            background: linear-gradient(180deg, #00f2fe 0%, #0061ff 100%);
            border: none; padding: 20px 85px; border-radius: 60px;
            color: white; font-size: 24px; font-weight: 900; box-shadow: 0 15px 50px rgba(0, 97, 255, 0.6);
            cursor: pointer; text-transform: uppercase;
        }

        .nav {
            position: absolute; bottom: 0; width: 100%; height: 90px; z-index: 100;
            background: rgba(0,0,0,0.95); display: flex; justify-content: space-around;
            padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #444; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--neon); }

        /* Paneller */
        .panel { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #00040a; z-index: 200; padding: 30px; box-sizing: border-box; overflow-y: auto;
        }
        .card { background: rgba(255,255,255,0.04); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        #fish-popup {
            display: none; position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
            background: rgba(0,20,40,0.98); border: 2px solid var(--neon); border-radius: 30px;
            padding: 40px; text-align: center; z-index: 300;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="stat"><span class="val" id="g-v">139</span><span class="lbl">DEEP COIN</span></div>
    <div class="stat"><span class="val" id="x-v" style="color:var(--neon)">0</span><span class="lbl">X-POINTS</span></div>
    <div class="stat"><span class="val" id="lvl-v" style="color:#fff">1</span><span class="lbl">LEVEL</span></div>
</div>

<div class="vault-ui">
    <span class="lbl" style="color:var(--gold)">KASA</span>
    <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
    <span id="v-text" style="color:#fff; font-size:10px; font-weight:bold;">0.1%</span>
</div>

<div class="action-hub">
    <button id="castBtn" class="cast-btn" onclick="handleCast()">OLTA AT</button>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showPanel('game')">🌊 DENİZ</div>
    <div class="nav-item" onclick="showPanel('borsa')">📈 BORSA</div>
    <div class="nav-item" onclick="showPanel('inv')">🎒 KOVA</div>
    <div class="nav-item" onclick="showPanel('bank')">🏦 KASA</div>
</div>

<div id="p-borsa" class="panel">
    <h2>📈 BORSA</h2>
    <div id="borsa-list"></div>
    <button onclick="showPanel('game')" class="buy-btn">KAPAT</button>
</div>

<div id="p-inv" class="panel">
    <h2>🎒 KOVA</h2>
    <div id="inv-list">Kovanız boş...</div>
    <button onclick="showPanel('game')" class="buy-btn">KAPAT</button>
</div>

<div id="p-bank" class="panel">
    <h2>🏦 KASA (100K TL HEDEF)</h2>
    <h1 id="v-tl" style="color:var(--gold)">10.50 TL</h1>
    <p>X puanına göre dağıtım yapılır.</p>
    <button onclick="showPanel('game')" class="buy-btn">KAPAT</button>
</div>

<div id="fish-popup" onclick="this.style.display='none'">
    <span id="f-icon" style="font-size: 80px;">🐟</span>
    <h2 id="f-name">Balık!</h2>
    <p id="f-reward" style="color:var(--neon)">+1 X-Point</p>
</div>

<script>
    const tg = window.Telegram.WebApp; tg.expand();

    let player = { gold: 139, x: 0, lvl: 1, inv: {} };
    let vault = { current: 10.50, target: 100000 };
    const FISH_DATA = [
        { name: "Sardalya", icon: "🐟", chance: 70, x: 1, price: 10 },
        { name: "Levrek", icon: "🐠", chance: 20, x: 5, price: 50 },
        { name: "Orkinos", icon: "🍱", chance: 8, x: 25, price: 150 },
        { name: "Köpekbalığı", icon: "🦈", chance: 2, x: 100, price: 600 }
    ];

    // --- 3D SİSTEMİ ---
    let scene, camera, renderer, water, boat, clock;

    function init3D() {
        try {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 15, 50);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // Basit Su
            const waterGeom = new THREE.PlaneGeometry(1000, 1000);
            const waterMat = new THREE.MeshPhongMaterial({ color: 0x001e3c, shininess: 100 });
            water = new THREE.Mesh(waterGeom, waterMat);
            water.rotation.x = -Math.PI / 2;
            scene.add(water);

            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x404040));

            // Basit Tekne
            const boatGeom = new THREE.BoxGeometry(6, 2, 10);
            const boatMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
            boat = new THREE.Mesh(boatGeom, boatMat);
            scene.add(boat);

            animate();
        } catch (e) { console.error("3D Hatası:", e); }
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if(boat) {
            boat.position.y = Math.sin(t * 1.5) * 0.5;
            boat.rotation.z = Math.sin(t) * 0.05;
        }
        renderer.render(scene, camera);
    }

    // --- OYNANIŞ ---
    function handleCast() {
        const btn = document.getElementById('castBtn');
        btn.disabled = true; btn.innerText = "BEKLE...";
        tg.HapticFeedback.impactOccurred('heavy');

        setTimeout(() => {
            let roll = Math.random() * 100;
            let caught = FISH_DATA[0];
            let acc = 0;
            for(let f of FISH_DATA) {
                acc += f.chance;
                if(roll <= acc) { caught = f; break; }
            }

            player.inv[caught.name] = (player.inv[caught.name] || 0) + 1;
            player.x += caught.x;
            vault.current += 0.20;

            document.getElementById('f-icon').innerText = caught.icon;
            document.getElementById('f-name').innerText = caught.name;
            document.getElementById('f-reward').innerText = `+${caught.x} X-Points`;
            document.getElementById('fish-popup').style.display = 'block';

            updateUI();
            btn.disabled = false; btn.innerText = "OLTA AT";
            tg.HapticFeedback.notificationOccurred('success');
        }, 4000);
    }

    function updateUI() {
        document.getElementById('g-v').innerText = Math.floor(player.gold);
        document.getElementById('x-v').innerText = player.x;
        document.getElementById('v-tl').innerText = vault.current.toFixed(2) + " TL";
        let prog = (vault.current / vault.target) * 100;
        document.getElementById('v-fill').style.width = Math.min(prog, 100) + "%";
        document.getElementById('v-text').innerText = prog.toFixed(2) + "%";
    }

    function showPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
        if(id !== 'game') {
            document.getElementById('p-' + id).style.display = 'block';
            if(id === 'borsa') renderBorsa();
            if(id === 'inv') renderInventory();
        }
    }

    function renderBorsa() {
        let html = "";
        FISH_DATA.forEach(f => {
            let price = Math.floor(f.price * (0.9 + Math.random() * 0.2));
            html += `<div class="card">
                <div>${f.icon} ${f.name} <br> Fiyat: ${price} 🪙</div>
                <button onclick="sellFish('${f.name}', ${price})" class="buy-btn">SAT</button>
            </div>`;
        });
        document.getElementById('borsa-list').innerHTML = html;
    }

    function renderInventory() {
        let html = "";
        for(let n in player.inv) {
            if(player.inv[n] > 0) html += `<div class="card">${n}: ${player.inv[n]} adet</div>`;
        }
        document.getElementById('inv-list').innerHTML = html || "Kovanız boş.";
    }

    function sellFish(name, price) {
        if(player.inv[name] > 0) {
            player.inv[name]--;
            let gain = Math.floor(price * 0.9); // %10 vergi
            player.gold += gain;
            updateUI();
            renderBorsa();
            tg.showPopup({ message: `${name} satıldı! %10 vergi kesildi.` });
        }
    }

    window.onload = init3D;
</script>
</body>
</html>
