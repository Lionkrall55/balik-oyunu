<script>
    const tg = window.Telegram.WebApp; tg.expand();
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    const FISH_POOL = [
        {name:"Sardalya",chance:40,basePrice:10,xp:5,icon:"🐟"},
        {name:"Hamsi",chance:25,basePrice:15,xp:8,icon:"🐠"},
        {name:"Somon",chance:18,basePrice:35,xp:25,icon:"🐟"},
        {name:"Orkinos",chance:12,basePrice:70,xp:40,icon:"🐟"},
        {name:"Köpek Balığı",chance:4,basePrice:200,xp:80,icon:"🦈"},
        {name:"Mavi Balina",chance:1,basePrice:600,xp:150,icon:"🐋"}
    ];
    
    let player = { username: tg.initDataUnsafe?.user?.username || "Kaptan_Patron", logo: "⚓", gold: 100, xp: 0, level: 1, multiplier: 1.0, shieldTime: 12, inventory: {}, used_promos: [] };
    let borsaPrices = {}; FISH_POOL.forEach(f => borsaPrices[f.name] = f.basePrice);
    
    let waveTime = 0; let isFishing = false; let selectedFish = "Somon";

    // 🎥 Jack's Farm Tarzı 60 FPS Canlı Grafik ve Dalga Çizim Motoru
    function renderLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        waveTime += 0.03;

        // Canlı Dalgalanan Okyanus Çizimi
        let seaLevel = canvas.height * 0.58;
        ctx.fillStyle = 'rgba(1, 22, 40, 0.8)';
        ctx.beginPath();
        ctx.moveTo(0, seaLevel);
        for (let i = 0; i <= canvas.width; i += 10) {
            let y = seaLevel + Math.sin(waveTime + (i * 0.02)) * 8;
            ctx.lineTo(i, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        // Limanda Nefes Alan Kaptan Çizimi
        let centerX = canvas.width / 2;
        let centerY = canvas.height * 0.50;
        let breathe = isFishing ? (1 + Math.sin(waveTime * 5) * 0.05) : (1 + Math.sin(waveTime) * 0.02);
        
        ctx.fillStyle = '#051426';
        ctx.strokeStyle = isFishing ? '#ef4444' : '#00f2fe';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 40 * breathe, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Olta Misinası Çizgisi
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        if (isFishing) {
            ctx.lineTo(centerX + Math.sin(waveTime * 3) * 20, canvas.height * 0.68);
        } else {
            ctx.lineTo(centerX + 30, centerY + 25);
        }
        ctx.stroke();

        requestAnimationFrame(renderLoop);
    }

    function updateUI() {
        document.getElementById('username-display').innerText = player.logo + " KAPTAN: @" + player.username;
        document.getElementById('gold-display').innerText = player.gold;
        document.getElementById('level-display').innerText = player.level;
        document.getElementById('x-display').innerText = player.multiplier.toFixed(2);
        document.getElementById('shield-status').innerText = player.shieldTime > 0 ? `AÇIK (${player.shieldTime}sa)` : "KORUMASIZ 🚨";
        document.getElementById('shield-status').style.color = player.shieldTime > 0 ? "#22c55e" : "#ef4444";
        
        let invHtml = ""; let hasItem = false;
        for (let fish in player.inventory) {
            if(player.inventory[fish] > 0) { invHtml += `<div class="shop-item"><div>🐟 ${fish} (x${player.inventory[fish]})</div></div>`; hasItem = true; }
        }
        document.getElementById('inv-list').innerHTML = hasItem ? invHtml : "Kovan boş, henüz denizden bir şey çıkmadı.";
        renderLiveBorsa();
    }

    function renderLiveBorsa() {
        let candleHtml = ""; let marketHtml = "";
        FISH_POOL.forEach(fish => {
            let type = Math.random() > 0.5 ? 'green' : 'red';
            let h = Math.floor(Math.random() * 35) + 15;
            candleHtml += `<div class="candle ${type}" style="height: ${h}px;" onclick="changeChart('${fish.name}')"></div>`;
            marketHtml += `<div class="shop-item" onclick="changeChart('${fish.name}')" style="cursor:pointer;"><div>⚓ <strong>${fish.name}</strong> (Kovanda: ${player.inventory[fish.name]||0})</div><div style="color:#22c55e; font-weight:bold;">${borsaPrices[fish.name]} 🪙</div></div>`;
        });
        document.getElementById('chart-candles-holder').innerHTML = candleHtml;
        document.getElementById('market-list').innerHTML = marketHtml;
    }

    function changeChart(name) {
        selectedFish = name;
        document.getElementById('chart-title').innerText = `🦈 ${name}/GOLD Canlı Mum Akışı`;
    }

    // 📈 Market Maker Otomatik Canlı Fiyat Tahtası
    setInterval(() => {
        FISH_POOL.forEach(fish => {
            let change = (Math.random() * 0.24) - 0.12;
            borsaPrices[fish.name] = Math.max(fish.basePrice, Math.floor(borsaPrices[fish.name] * (1 + change)));
        });
        if(!isFishing) { let v = (Math.random() * 12 + 1).toFixed(2); document.getElementById('status-msg').innerText = `Okyanus dalgalanıyor... Hacim anlık %${v} arttı!`; }
        renderLiveBorsa();
    }, 4000);

    function startFishing() {
        if(isFishing) return; isFishing = true;
        let btn = document.getElementById('action-btn');
        document.getElementById('fish-popup').style.display = 'none';
        btn.disabled = true;
        document.getElementById('status-msg').innerText = "Misinayı derin sulara bırakıyorsun...";
        
        let timeLeft = 6; btn.innerText = `⏳ ${timeLeft}sn`;
        let timer = setInterval(() => {
            timeLeft--; btn.innerText = `⏳ ${timeLeft}sn`;
            if(timeLeft <= 0) { clearInterval(timer); isFishing = false; btn.disabled = false; btn.innerText = "⚓ OLTAYI FIRLAT"; calculateCatch(); }
        }, 1000);
    }

    function calculateCatch() {
        let roll = Math.floor(Math.random() * 100) + 1; let cumulative = 0; let caught = FISH_POOL;
        for(let fish of FISH_POOL) { cumulative += fish.chance; if(roll <= cumulative) { caught = fish; break; } }
        player.inventory[caught.name] = (player.inventory[caught.name] || 0) + 1;
        player.xp += caught.xp; player.level = Math.floor(player.xp / 100) + 1;
        
        let popup = document.getElementById('fish-popup');
        document.getElementById('card-icon').innerText = caught.icon;
        document.getElementById('card-name').innerText = caught.name;
        document.getElementById('card-reward').innerText = `+${caught.xp} XP | +0.01X Çarpan`;
        popup.style.display = 'block'; player.multiplier += 0.01;
        document.getElementById('status-msg').innerText = "Kılavuz ve makara çekildi!"; updateUI();
    }

    function sellAllFish() {
        let total = 0; for(let fish in player.inventory) { total += borsaPrices[fish] * player.inventory[fish]; }
        if(total === 0) { showAlert("Kovanda satacak balık yok!"); return; }
        let tax = Math.floor(total * 0.10); let finalGain = total - tax;
        player.gold += finalGain; player.inventory = {}; updateUI();
        showAlert(`🏛️ Satış Başarılı!<br>Liman Vergisi (%10): ${tax} 🪙<br>Hesaba Geçen: ${finalGain} 🪙`);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.menu-view').forEach(m => m.style.display = 'none');
        
        let activeBtn = document.getElementById('btn-' + tab);
        if(activeBtn) activeBtn.classList.add('active');
        
        if(tab === 'fish') { document.getElementById('fish-popup').style.display = 'none'; document.getElementById('action-btn').style.display = 'inline-block'; }
        else { document.getElementById('action-btn').style.display = 'none'; document.getElementById(tab + '-menu').style.display = 'block'; }
    }

    function claimPromoCode() {
        let code = document.getElementById('promo-input').value.trim().toUpperCase();
        if(player.used_promos.includes(code)) { showAlert("🚨 Bu kodu zaten kullandın kaptan!"); return; }
        
        if(code === "YOUTUBE15" || code === "KRİPTOBALİNA" || code === "BORSAKRALI") {
            player.multiplier += 0.15; player.gold += 500; player.used_promos.push(code); player.logo = "📺"; updateUI();
            showAlert(`📺 <b>ORTAKLIK KODU ONAYLANDI!</b><br><br>Girdiğin YouTuber kodu başarıyla işlendi patron!<br>• Çarpan: <b>+0.15X Kalıcı</b><br>• Ödül: <b>+500 Deep Coin</b><br>• Sancak: <b>📺 Yayıncı Logosu Kuşanıldı!</b>`);
        } else { showAlert("❌ Geçersiz veya süresi dolmuş bir YouTuber kodu girdin patron!"); }
    }

    function showAlert(text) { document.getElementById('alert-msg').innerHTML = text; document.getElementById('alert-box').style.display = "block"; }
    function activateShield() { player.shieldTime += 4; updateUI(); }
    function watchAds() { player.shieldTime += 1; player.multiplier += 0.05; updateUI(); }
    function buyFactory() { if(player.gold < 1000) { showAlert("Yetersiz bakiye!"); return; } player.gold -= 1000; player.multiplier += 0.50; updateUI(); }
    function simulatePvP() { if(player.gold < 10) { showAlert("En az 10 Coin lazım!"); return; } player.gold -= 10; let resBox = document.getElementById('pvp-result'); if(Math.random() < 0.4) { resBox.innerHTML = "🛡️ Liman Kalkanlı Çıktı!"; resBox.style.color = "#ef4444"; } else { player.gold += 150; resBox.innerHTML = "🎯 Kovasından 150 🪙 aşırdın!"; resBox.style.color = "#22c55e"; } updateUI(); }
    function openDailyBox() { let r = Math.random(); if(r < 0.6) { player.gold += 100; showAlert("🎁 Sandıktan 100 Deep Coin Çıktı!"); } else { player.shieldTime += 2; showAlert("🎁 Sandıktan +2 Saat Kalkan Çıktı!"); } updateUI(); }

    updateUI();
    requestAnimationFrame(renderLoop);
</script>
</body>
</html>
