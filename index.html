<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSea Pro - Masterpiece</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2fe; --gold: #ffd700; --deep: #00050a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        
        /* 🎥 SİNEMATİK POST-PROCESSING */
        #render-container {
            position: absolute; width: 100%; height: 100%;
            filter: contrast(1.1) saturate(1.2) brightness(1.05);
            z-index: 1;
        }

        /* 💎 ELİT UI TASARIMI */
        .ui-panel {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
            padding: 25px 0; display: flex; justify-content: space-around;
            backdrop-filter: blur(5px); border-bottom: 1px solid rgba(0,242,254,0.1);
        }
        .stat-box { text-align: center; }
        .stat-val { display: block; font-size: 26px; font-weight: 900; color: var(--gold); text-shadow: 0 0 25px rgba(255,215,0,0.5); }
        .stat-lbl { font-size: 10px; color: var(--neon); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }

        /* 💰 KASA DURUMU (BANKA KALİTESİNDE) */
        .vault-meter {
            position: absolute; top: 115px; left: 20px; right: 20px; z-index: 100;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 15px; display: flex; align-items: center;
        }
        .v-bar { flex-grow: 1; height: 10px; background: #000; border-radius: 5px; margin: 0 15px; overflow: hidden; }
        .v-fill { width: 0.5%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); box-shadow: 0 0 20px var(--gold); transition: width 1.5s cubic-bezier(0.1, 0.7, 1.0, 0.1); }

        /* ⚓ MASTER AKSİYON BUTONU */
        .action-hub { position: absolute; bottom: 130px; width: 100%; text-align: center; z-index: 100; }
        .btn-master {
            background: linear-gradient(180deg, #00f2fe 0%, #0061ff 100%);
            border: none; padding: 25px 95px; border-radius: 100px;
            color: white; font-size: 24px; font-weight: 900; text-transform: uppercase;
            box-shadow: 0 25px 70px rgba(0, 97, 255, 0.7);
            cursor: pointer; letter-spacing: 5px; transition: 0.3s;
        }
        .btn-master:active { transform: scale(0.9) translateY(10px); }

        /* 📱 PRO NAVİGASYON */
        .nav {
            position: absolute; bottom: 0; width: 100%; height: 100px; z-index: 100;
            background: rgba(0,0,0,0.98); display: flex; justify-content: space-around;
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item { color: #555; font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item.active { color: var(--neon); text-shadow: 0 0 15px var(--neon); }

        /* 🎨 KARAKTER VE GERÇEKÇİLİK KATMANI */
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 50; pointer-events: none; }
    </style>
</head>
<body>

<div id="render-container"></div>
<canvas id="game-canvas"></canvas>

<div class="ui-panel">
    <div class="stat-box"><span class="stat-val" id="gold">148</span><span class="stat-lbl">DEEP COIN</span></div>
    <div class="stat-box"><span class="stat-val" id="xpoints" style="color:var(--neon)">12</span><span class="stat-lbl">X-POINTS</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#fff">1</span><span class="stat-lbl">SEVİYE</span></div>
</div>

<div class="vault-meter">
    <span class="stat-lbl" style="color:var(--gold)">KASA</span>
    <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
    <span id="v-text" style="font-size:12px; font-weight:900; color:white;">0.01%</span>
</div>

<div class="action-hub">
    <button id="castBtn" class="btn-master" onclick="handleCast()">OLTA AT</button>
    <p style="color:var(--neon); font-size:10px; font-weight:bold; margin-top:25px; letter-spacing:8px; opacity:0.8;">📍 PACIFIC OCEAN SIM 4K</p>
</div>

<div class="nav">
    <div class="nav-item active">DENİZ</div>
    <div class="nav-item">BORSA</div>
    <div class="nav-item">FİLO</div>
    <div class="nav-item">RANK</div>
    <div class="nav-item">BANKA</div>
</div>

<script>
    const tg = window.Telegram.WebApp; tg.expand();
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    let gold = 148, xpoints = 12, vaultTL = 10.50, time = 0, isFishing = false;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 🎮 GERÇEKÇİ OKYANUS VE IŞIK MOTORU (THREE.JS) ---
    let scene, camera, renderer, water, clock;

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(0, 15, 50);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('render-container').appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // 🌊 GERÇEKÇİ SU MATERYALİ
        const waterGeom = new THREE.PlaneGeometry(1000, 1000, 128, 128);
        const waterMat = new THREE.MeshPhongMaterial({
            color: 0x001a33,
            shininess: 150,
            specular: 0x00f2fe,
            transparent: true,
            opacity: 0.95
        });
        water = new THREE.Mesh(waterGeom, waterMat);
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // ☀️ SİNEMATİK IŞIKLAR
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 100, 50);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040, 0.6));

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        
        // Su Dalgalanma Simülasyonu
        const pos = water.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let y = pos.getY(i);
            let z = Math.sin(x * 0.1 + t * 2) * 0.7 + Math.cos(y * 0.1 + t * 1.5) * 0.7;
            pos.setZ(i, z);
        }
        pos.needsUpdate = true;

        renderer.render(scene, camera);
        draw2D(t);
    }

    // --- 👨‍🌾 GERÇEKÇİ KARAKTER VE DETAY ÇİZİMİ ---
    function draw2D(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height * 0.68 + Math.sin(t * 1.5) * 8; // Gemi sallanması

        // 🚢 DETAYLI GEMİ
        ctx.fillStyle = '#050a10';
        ctx.beginPath();
        ctx.moveTo(cx - 130, cy);
        ctx.quadraticCurveTo(cx, cy + 25, cx + 130, cy);
        ctx.lineTo(cx + 100, cy + 60);
        ctx.lineTo(cx - 100, cy + 60);
        ctx.fill();
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 🧔 GERÇEKÇİ BALIKÇI (Yüz Hatları ve Detaylar)
        ctx.save();
        ctx.translate(cx - 30, cy - 80);

        // Kafa ve Yüz
        ctx.fillStyle = '#f5cba7'; // Ten rengi
        ctx.beginPath();
        ctx.arc(15, 0, 18, 0, Math.PI * 2); // Kafa
        ctx.fill();

        // Gözler ve Sakal (Detaylar burada!)
        ctx.fillStyle = '#2d1e12';
        ctx.fillRect(8, -5, 4, 2); // Sol Göz
        ctx.fillRect(18, -5, 4, 2); // Sağ Göz
        ctx.beginPath();
        ctx.arc(15, 10, 10, 0, Math.PI); // Sakal hattı
        ctx.fill();

        // Şapka (Kaptan Şapkası)
        ctx.fillStyle = '#000';
        ctx.fillRect(-5, -22, 40, 8); // Şapka kenarı
        ctx.beginPath();
        ctx.moveTo(0, -22); ctx.lineTo(30, -22); ctx.lineTo(15, -35); ctx.closePath();
        ctx.fill();

        // Gövde ve Kıyafet (Yağmurluk)
        ctx.fillStyle = '#f1c40f'; // Sarı balıkçı yağmurluğu
        ctx.beginPath();
        ctx.roundRect(-10, 18, 50, 70, [15, 15, 0, 0]);
        ctx.fill();
        
        ctx.restore();

        // 🎣 OLTA VE MİSİNA (Dinamik)
        ctx.strokeStyle = isFishing ? '#00f2fe' : '#333';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 40);
        let rodAngle = isFishing ? 10 : -35;
        let rodX = cx + Math.cos(rodAngle * Math.PI / 180) * 150;
        let rodY = (cy - 40) + Math.sin(rodAngle * Math.PI / 180) * 150;
        ctx.lineTo(rodX, rodY);
        ctx.stroke();

        if (isFishing) {
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(rodX, rodY);
            ctx.lineTo(rodX + 20, canvas.height);
            ctx.stroke();
        }
    }

    function handleCast() {
        if(isFishing) return;
        isFishing = true;
        
        tg.HapticFeedback.impactOccurred('heavy');
        const btn = document.getElementById('castBtn');
        btn.disabled = true;
        btn.innerText = "⚓ BEKLE...";

        setTimeout(() => {
            gold += 25; xpoints += 5; vaultTL += 0.85;
            updateUI();
            btn.disabled = false; btn.innerText = "OLTA AT";
            isFishing = false;
            tg.HapticFeedback.notificationOccurred('success');
        }, 4000);
    }

    function updateUI() {
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('xpoints').innerText = xpoints;
        let prog = (vaultTL / 100000) * 100;
        document.getElementById('v-fill').style.width = Math.min(prog, 100) + "%";
        document.getElementById('v-text').innerText = prog.toFixed(2) + "%";
    }

    window.onload = init3D;
</script>
</body>
</html>
