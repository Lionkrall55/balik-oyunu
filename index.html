<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSea - Canlı Deniz v0.2.1</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a192f 0%, #020c1b 100%); color: white;
            user-select: none; -webkit-user-select: none; overflow: hidden;
        }
        .container { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; text-align: center; }
        .header { background: rgba(2, 12, 27, 0.85); padding: 15px; border-bottom: 2px solid #00f2fe; box-shadow: 0 4px 20px rgba(0,242,254,0.2); }
        .user-info { font-size: 15px; color: #00f2fe; margin-bottom: 5px; font-weight: bold; letter-spacing: 0.5px; }
        .stats { display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; }
        .game-screen { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle at center, #172a45 0%, #0a192f 100%); }
        
        .sea-area { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; }
        .water-ring {
            position: absolute; width: 100px; height: 100px; border: 4px solid #00f2fe; border-radius: 50%;
            animation: ripple 2s infinite linear; opacity: 0; display: none;
        }
        @keyframes ripple {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .fisherman-emoji { font-size: 75px; transition: transform 0.3s; z-index: 2; }
        .fisherman-emoji.fishing { animation: reel 1s infinite alternate; }
        @keyframes reel { 0% { transform: rotate(0deg); } 100% { transform: rotate(-15deg); } }

        .fish-card {
            display: none; position: absolute; background: rgba(2, 12, 27, 0.95);
            border: 3px solid #00f2fe; border-radius: 20px; padding: 20px; width: 180px;
            box-shadow: 0 0 30px rgba(0,242,254,0.5); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5;
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .fish-card.common { border-color: #cbd5e1; box-shadow: 0 0 20px rgba(203,213,225,0.4); }
        .fish-card.rare { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.6); }
        .fish-card.legendary { border-color: #a855f7; box-shadow: 0 0 25px rgba(168,85,247,0.7); animation: shake 0.5s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .status-text { font-size: 16px; margin: 15px; min-height: 25px; color: #cbd5e1; font-weight: 500; }
        .main-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #0a192f;
            border: none; padding: 18px 45px; font-size: 20px; font-weight: bold; border-radius: 50px;
            cursor: pointer; box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4); transition: all 0.2s;
            z-index: 3;
        }
        .main-btn:active { transform: scale(0.95); box-shadow: 0 4px 10px rgba(0, 242, 254, 0.2); }
        .main-btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        
        .nav-tabs { display: flex; background: rgba(2, 12, 27, 0.9); border-top: 2px solid #1e293b; z-index: 10; }
        .tab-btn { flex: 1; background: none; border: none; color: #64748b; padding: 16px 0; font-size: 14px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .tab-btn.active { color: #00f2fe; background: linear-gradient(0deg, rgba(0,242,254,0.08) 0%, rgba(0,0,0,0) 100%); }
        .menu-view { display: none; width: 90%; max-height: 55vh; overflow-y: auto; background: rgba(2, 12, 27, 0.98); border: 2px solid #1e293b; border-radius: 20px; padding: 15px; position: absolute; bottom: 85px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 8; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #1e293b; }
        .buy-btn { background: #00f2fe; border: none; padding: 8px 16px; color: #020c1b; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div id="username-display" class="user-info">⚓ KAPTAN: @Gezgin_Balikci</div>
        <div class="stats">
            <div>🪙 <span id="gold-display">100</span></div>
            <div>🌟 Lv.<span id="level-display">1</span> (<span id="xp-display">0</span> XP)</div>
        </div>
    </div>

    <div class="game-screen">
        <div class="sea-area">
            <div id="ripple-effect" class="water-ring"></div>
            <div id="game-char" class="fisherman-emoji">🧍‍♂️</div>
            
            <div id="fish-popup" class="fish-card" onclick="closeCard()">
                <div id="card-rarity" style="font-size:12px; font-weight:bold; letter-spacing:1px; margin-bottom:5px;">YAYGIN</div>
                <div id="card-icon" style="font-size:55px; margin:10px 0;">🐟</div>
                <div id="card-name" style="font-size:18px; font-weight:bold;">Sardalya</div>
                <div id="card-reward" style="font-size:14px; color:#00f2fe; margin-top:5px;">+2 XP</div>
                <div style="font-size:11px; color:#64748b; margin-top:10px;">Kapatmak için dokun</div>
            </div>
        </div>

        <div id="status-msg" class="status-text">Derin deniz seni bekliyor, olta at!</div>
        <button id="action-btn" class="main-btn" onclick="startFishing()"> Olta At</button>

        <!-- Mağaza -->
        <div id="shop-menu" class="menu-view">
            <h3 style="color:#00f2fe; margin-top:0;">🛒 Ekipman Mağazası</h3>
            <div class="shop-item">
                <div><strong>Ahşap Olta</strong><br><small style="color:#64748b;">Süre: 7sn | Şans: +%10</small></div>
                <button class="buy-btn" onclick="buyRod('Ahşap Olta', 500)">500 🪙</button>
            </div>
            <div class="shop-item">
                <div><strong>Karbon Olta</strong><br><small style="color:#64748b;">Süre: 4sn | Şans: +%25</small></div>
                <button class="buy-btn" onclick="buyRod('Karbon Olta', 2000)">2000 🪙</button>
            </div>
        </div>

        <!-- Kova -->
        <div id="inventory-menu" class="menu-view">
            <h3 style="color:#00f2fe; margin-top:0;">🎒 Balık Kovası</h3>
            <div id="inv-list" style="margin-bottom: 15px;">Kovan boş, henüz denizden bir şey çıkmadı.</div>
            <button class="main-btn" style="font-size:15px; padding:12px 30px; width:100%; border-radius:12px;" onclick="sellAllFish()">💰 Tüm Balıkları Sat</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button id="tab-fish" class="tab-btn active" onclick="switchTab('fish')"> Avlan</button>
        <button id="tab-shop" class="tab-btn" onclick="switchTab('shop')">🛒 Market</button>
        <button id="tab-inv" class="tab-btn" onclick="switchTab('inv')">🎒 Kova</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const FISH_POOL = [
        { name: "Sardalya", chance: 40, price: 5, xp: 2, icon: "🐟", rarity: "common", rName: "YAYGIN" },
        { name: "Hamsi", chance: 30, price: 10, xp: 3, icon: "🐠", rarity: "common", rName: "YAYGIN" },
        { name: "İstavrit", chance: 18, price: 20, xp: 5, icon: "🐟", rarity: "common", rName: "YAYGIN" },
        { name: "Kefal", chance: 10, price: 50, xp: 10, icon: "🐡", rarity: "rare", rName: "NADİR" },
        { name: "Levrek", chance: 2, price: 200, xp: 30, icon: "🦈", rarity: "legendary", rName: "EFSANEVİ" }
    ];

    const RODS = {
        "Bambu Olta": { cooldown: 10 },
        "Ahşap Olta": { cooldown: 7 },
        "Karbon Olta": { cooldown: 4 }
    };

    let player = {
        username: tg.initDataUnsafe?.user?.username || "Gezgin_Balikci",
        gold: 100, xp: 0, level: 1, current_rod: "Bambu Olta", inventory: {}
    };

    if(localStorage.getItem('deepsea_save')) {
        player = JSON.parse(localStorage.getItem('deepsea_save'));
    }

    function saveGame() {
        localStorage.setItem('deepsea_save', JSON.stringify(player));
        updateUI();
    }

    function showTelegramAlert(msg) {
        if (tg.showAlert) {
            tg.showAlert(msg);
        } else {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
        }
    }

    function updateUI() {
        document.getElementById('username-display').innerText = "⚓ KAPTAN: @" + player.username;
        document.getElementById('gold-display').innerText = player.gold;
        document.getElementById('level-display').innerText = player.level;
        document.getElementById('xp-display').innerText = player.xp;

        let invHtml = "";
        let hasItem = false;
        for (let fish in player.inventory) {
            if(player.inventory[fish] > 0) {
                let fishData = FISH_POOL.find(f => f.name === fish);
                invHtml += `<div class="shop-item"><div>${fishData.icon} ${fish} (x${player.inventory[fish]})</div><div style="color:#00f2fe; font-weight:bold;">${fishData.price * player.inventory[fish]} 🪙</div></div>`;
                hasItem = true;
            }
        }
        document.getElementById('inv-list').innerHTML = hasItem ? invHtml : "Kovan boş, henüz denizden bir şey çıkmadı.";
    }

    function switchTab(tab) {
