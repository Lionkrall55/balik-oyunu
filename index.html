<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Sea Pro - Elite Fishing</title>
    <!-- Profesyonel Oyun Motoru (Phaser 3) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #00040a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Modern Üst Panel (Glassmorphism) */
        .header {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            padding: 15px; background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px; z-index: 100; color: white;
        }

        .stat { display: flex; flex-direction: column; align-items: center; }
        .val { font-size: 18px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .lbl { font-size: 10px; opacity: 0.6; text-transform: uppercase; }

        /* Olta Atma Butonu */
        #ui-footer {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; flex-direction: column; align-items: center; z-index: 100;
        }

        .cast-btn {
            background: linear-gradient(180deg, #00f2fe 0%, #4facfe 100%);
            border: none; padding: 20px 70px; border-radius: 50px;
            color: white; font-size: 22px; font-weight: 900;
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.4);
            cursor: pointer; transition: 0.2s;
        }
        .cast-btn:active { transform: scale(0.92); }
        .cast-btn:disabled { background: #2c3e50; box-shadow: none; opacity: 0.6; }

        /* Alt Menü */
        .nav {
            position: absolute; bottom: 0; width: 100%; height: 80px;
            background: rgba(0,0,0,0.9); display: flex; justify-content: space-around;
            padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 101;
        }
        .nav-item { color: #555; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .nav-item.active { color: #00f2fe; }
    </style>
</head>
<body>

<div class="header">
    <div class="stat"><span class="val" id="gold">139</span><span class="lbl">DEEP COIN</span></div>
    <div class="stat"><span class="val" style="color: #a855f7;">0</span><span class="lbl">STARS</span></div>
    <div class="stat"><span class="val" style="color: #fff;">1</span><span class="lbl">LEVEL</span></div>
</div>

<div id="ui-footer">
    <button id="main-cast-btn" class="cast-btn" onclick="gameCast()">OLTA AT</button>
</div>

<div class="nav">
    <div class="nav-item active">🌊 DENİZ</div>
    <div class="nav-item">🛒 MARKET</div>
    <div class="nav-item">🚢 FİLO</div>
    <div class="nav-item">📍 LİMANLAR</div>
</div>

<div id="game-container"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Phaser 3 Konfigürasyonu
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, water1, water2, water3, particles;

    function preload() {
        // Yüksek kaliteli gerçekçi görseller
        // Bu linkler gerçekçi deniz ve balıkçı görselleridir
        this.load.image('sky', 'https://images.unsplash.com/photo-1518837697219-af5237c14352?auto=format&fit=crop&w=1000&q=80');
        this.load.image('waves', 'https://i.ibb.co/3pY6X0s/water-texture.png'); 
        this.load.image('boat', 'https://i.ibb.co/X396mY6/fisherman-silhouette.png');
    }

    function create() {
        // 1. Gökyüzü (Statik)
        let sky = this.add.image(config.width/2, config.height/2, 'sky');
        sky.setDisplaySize(config.width, config.height);

        // 2. Parallax Deniz Katmanları (Gerçekçiliğin Sırrı)
        water1 = this.add.tileSprite(config.width/2, config.height * 0.8, config.width, 400, 'waves').setAlpha(0.3);
        water2 = this.add.tileSprite(config.width/2, config.height * 0.85, config.width, 400, 'waves').setAlpha(0.6).setTint(0x0055ff);
        water3 = this.add.tileSprite(config.width/2, config.height * 0.9, config.width, 400, 'waves').setTint(0x001133);

        // 3. Karakter (Gemi & Balıkçı)
        player = this.add.image(config.width/2, config.height * 0.65, 'boat');
        player.setScale(0.6);

        // Gerçekçi Sallanma Animasyonu (Tween)
        this.tweens.add({
            targets: player,
            y: player.y + 8,
            angle: 1,
            duration: 2500,
            yoyo: true,
            loop: -1,
            ease: 'Sine.easeInOut'
        });

        // 4. Parçacık Sistemi (Su Köpükleri)
        particles = this.add.particles(0, 0, 'waves', {
            speed: 100,
            scale: { start: 0.05, end: 0 },
            alpha: { start: 0.5, end: 0 },
            blendMode: 'ADD',
            emitting: false
        });
    }

    function update() {
        // Her katman farklı hızda hareket ederek derinlik yaratır
        water1.tilePositionX += 0.2;
        water2.tilePositionX += 0.5;
        water3.tilePositionX += 0.8;
    }

    // Oyun Mekaniği (UI ile Bağlantı)
    function gameCast() {
        const btn = document.getElementById('main-cast-btn');
        btn.disabled = true;
        btn.innerText = "BEKLEYİN...";
        
        tg.HapticFeedback.impactOccurred('medium');

        // Balık tutma animasyon simülasyonu
        setTimeout(() => {
            let gold = parseInt(document.getElementById('gold').innerText);
            gold += Math.floor(Math.random() * 25) + 10;
            document.getElementById('gold').innerText = gold;
            
            btn.disabled = false;
            btn.innerText = "OLTA AT";
            
            tg.HapticFeedback.notificationOccurred('success');
            
            // Başarı Pop-up (Opsiyonel buraya eklenebilir)
        }, 4000);
    }
</script>
</body>
</html>
