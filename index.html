<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSea - Fishing Game</title>
    <style>
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #username-display {
            font-size: 18px;
            color: #00d2ff;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .menu-view {
            display: none;
            margin-top: 20px;
        }
        #fish-menu {
            display: block;
        }
        .tab-bar {
            display: flex;
            justify-content: space-around;
            background: #14213d;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .tab-btn.active {
            background: #00d2ff;
            color: #0b1329;
            font-weight: bold;
        }
        .btn-main {
            background: #00d2ff;
            color: #0b1329;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-main:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #fish-popup, #alert-box {
            display: none;
            background: #1c2541;
            border: 2px solid #00d2ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: inline-block;
        }
        #card-icon {
            font-size: 50px;
        }
    </style>
</head>
<body>

    <!-- KAPTAN BİLGİSİ -->
    <div id="username-display">⚓ KAPTAN: @Kullanici</div>

    <!-- ALT MENÜ SEKME BUTONLARI -->
    <div class="tab-bar">
        <button id="tab-fish" class="tab-btn active" onclick="switchTab('fish')">🎣 Av</button>
        <button id="tab-trade" class="tab-btn" onclick="switchTab('trade')">📈 Borsa</button>
        <button id="tab-shop" class="tab-btn" onclick="switchTab('shop')">🛒 Mağaza</button>
        <button id="tab-pvp" class="tab-btn" onclick="switchTab('pvp')">⚔️ PvP</button>
        <button id="tab-inv" class="tab-btn" onclick="switchTab('inv')">🎒 Envanter</button>
    </div>

    <!-- 1. BALIK TUTMA EKRANI -->
    <div id="fish-menu" class="menu-view">
        <div id="status-msg">Deniz sakin, oltayı fırlatmaya hazırsın!</div>
        <br>
        <button id="action-btn" class="btn-main" onclick="startFishing()">⚓ OLTAYI FIRLAT</button>
        
        <br>
        <!-- BALIK YAKALAMA POPUP KARTI -->
        <div id="fish-popup">
            <div id="card-icon">🐟</div>
            <div id="card-name" style="font-weight: bold; font-size: 18px; margin: 10px 0;">Balık Adı</div>
            <div id="card-reward" style="color: #00d2ff; margin-bottom: 15px;">+10 XP</div>
            <br>
            <button class="tab-btn" style="background:#00d2ff; color:#0b1329; font-weight:bold;" onclick="closeCard()">Tamam</button>
        </div>
    </div>

    <!-- 2. BORSA EKRANI -->
    <div id="trade-menu" class="menu-view">
        <h2>Balık Borsası</h2>
        <p>Ticaret alanına hoş geldin.</p>
    </div>

    <!-- 3. MAĞAZA EKRANI -->
    <div id="shop-menu" class="menu-view">
        <h2>Olta & Kalkan Mağazası</h2>
        <button class="btn-main" onclick="activateFreeShield()">Ücretsiz Kalkan Al</button>
        <br><br>
        <button class="btn-main" onclick="buyPremiumShield(12)">12 Saatlik Kalkan Satın Al</button>
    </div>

    <!-- 4. PVP EKRANI -->
    <div id="pvp-menu" class="menu-view">
        <h2>PvP Arenası</h2>
        <p>Yakında aktif olacak!</p>
    </div>

    <!-- 5. ENVANTER EKRANI -->
    <div id="inventory-menu" class="menu-view">
        <h2>Envanter</h2>
        <p>Tuttuğun balıklar burada listelenir.</p>
    </div>

    <!-- UYARI KUTUSU -->
    <div id="alert-box">
        <div id="alert-msg">Uyarı mesajı</div>
        <br>
        <button class="tab-btn" style="background:#00d2ff; color:#0b1329;" onclick="closeAlert()">Kapat</button>
    </div>

    <!-- OYUNUN JAVASCRIPT MANTIĞI -->
    <script>
        let isFishing = false;

        let player = {
            username: "Kaptan",
            level: 1,
            xp: 0,
            multiplier: 1.0,
            rodTime: 10,
            inventory: {},
            freeShieldUsed: false,
            shieldTime: 0
        };

        const FISH_POOL = [
            { name: "Küçük İstavrit", icon: "🐟", chance: 50, xp: 10 },
            { name: "Somon", icon: "🐠", chance: 30, xp: 25 },
            { name: "Kılıç Balığı", icon: "🦈", chance: 15, xp: 50 },
            { name: "Altın Balina", icon: "🐳", chance: 5, xp: 120 }
        ];

        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function $(id){
            return document.getElementById(id);
        }

        function showAlert(text){
            $("alert-msg").innerHTML = text;
            $("alert-box").style.display = "block";
        }

        function closeAlert(){
            $("alert-box").style.display = "none";
        }

        function switchTab(tab) {
            document.querySelectorAll(".menu-view").forEach(menu => {
                menu.style.display = "none";
            });

            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("active");
            });

            const activeButton = document.getElementById("tab-" + tab);
            if (activeButton) activeButton.classList.add("active");

            if (tab === "fish") {
                document.getElementById("fish-popup").style.display = "none";
                return;
            }

            const menu = document.getElementById(tab + "-menu");
            if (menu) {
                menu.style.display = "block";
            }

            if (tab === "trade") {
                updateBorsaUI();
            }

            if (tab === "shop") {
                updateRodUI();
            }

            updateUI();
        }

        function updateUI() {
            // Arayüz yenileme işlemleri
        }

        function updateBorsaUI() {
            // Ticaret ekranı
        }

        function updateRodUI() {
            // Mağaza ekranı
        }

        function saveGame() {
            localStorage.setItem("deepsea_tg_v85", JSON.stringify(player));
        }

        function loadGame() {
            const save = localStorage.getItem("deepsea_tg_v85");
            if (save) {
                player = JSON.parse(save);
            }
        }

        function updateUsername() {
            document.getElementById("username-display").innerText =
                "⚓ KAPTAN: @" + (player.username || "Kaptan");
        }

        function startFishing() {
            if (isFishing) return;

            isFishing = true;

            const btn = document.getElementById("action-btn");
            btn.disabled = true;

            let time = player.rodTime || 10;

            document.getElementById("status-msg").innerText =
                "🎣 Olta denize atıldı...";

            btn.innerText = "⏳ " + time;

            const timer = setInterval(() => {
                time--;
                btn.innerText = "⏳ " + time;

                if (time <= 0) {
                    clearInterval(timer);
                    isFishing = false;
                    calculateCatch();
                }
            }, 1000);
        }

        function calculateCatch() {
            let random = Math.random() * 100;

            let total = 0;
            let fish = FISH_POOL[0];

            for (const f of FISH_POOL) {
                total += f.chance;
                if (random <= total) {
                    fish = f;
                    break;
                }
            }

            player.inventory[fish.name] =
                (player.inventory[fish.name] || 0) + 1;

            player.xp += fish.xp;
            player.level = Math.floor(player.xp / 100) + 1;
            player.multiplier += 0.01;

            document.getElementById("card-icon").innerText = fish.icon;
            document.getElementById("card-name").innerText = fish.name;
            document.getElementById("card-reward").innerText =
                "+" + fish.xp + " XP";

            document.getElementById("fish-popup").style.display = "block";

            document.getElementById("action-btn").disabled = false;
            document.getElementById("action-btn").innerText =
                "⚓ OLTAYI FIRLAT";

            saveGame();
            updateUI();
        }

        function closeCard() {
            document.getElementById("fish-popup").style.display = "none";
        }

        function activateFreeShield() {
            if (player.freeShieldUsed) {
                showAlert("Bugünkü ücretsiz kalkanını kullandın.");
                return;
            }

            player.freeShieldUsed = true;
            player.shieldTime = 4;

            saveGame();
            updateUI();

            showAlert("🛡️ 4 saatlik kalkan aktif!");
        }

        function buyPremiumShield(hours) {
            player.shieldTime += hours;

            saveGame();
            updateUI();

            showAlert("⭐ Premium kalkan aktif.");
        }

        loadGame();
        updateUsername();
        updateUI();
    </script>
</body>
</html>
