<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Sea Pro - Absolute Reality</title>
    <!-- Profesyonel 3D ve Render Motorları -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2fe; --gold: #ffd700; --deep: #00040a; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }

        /* 🎥 SİNEMATİK KATMANLAR (FİLM KALİTESİ İÇİN) */
        #render-target { position: absolute; width: 100%; height: 100%; z-index: 1; filter: contrast(1.15) brightness(1.05) saturate(1.25); }
        
        .cinematic-vignette {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.85) 100%);
            z-index: 50; pointer-events: none;
        }

        /* 💎 ELİT DASHBOARD */
        .ui-header {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            display: flex; justify-content: space-around; padding: 25px 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,242,254,0.1);
        }
        .stat { text-align: center; }
        .val { display: block; font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .lbl { font-size: 9px; color: var(--neon); text-transform: uppercase; letter-spacing: 3px; font-weight: bold; }

        /* 🏦 KASA (PROFESYONEL) */
        .vault-track {
            position: absolute; top: 110px; left: 20px; right: 20px; z-index: 100;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px; padding: 12px; display: flex; align-items: center;
        }
        .v-bar { flex-grow: 1; height: 8px; background: #000; border-radius: 4px; margin: 0 15px; overflow: hidden; }
        .v-fill { width: 0.1%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); box-shadow: 0 0 15px var(--gold); transition: width 1s ease-in-out; }

        /* ⚓ MASTER BUTTON */
        .action-container { position: absolute; bottom: 130px; width: 100%; text-align: center; z-index: 100; }
        .cast-btn {
            background: linear-gradient(180deg, #00f2fe 0%, #0061ff 100%);
            border: none; padding: 22px 90px; border-radius: 100px;
            color: white; font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
            box-shadow: 0 20px 60px rgba(0, 97, 255, 0.6); cursor: pointer; transition: 0.3s;
        }
        .cast-btn:active { transform: scale(0.92) translateY(5px); }

        /* 📱 NAVİGASYON */
        .nav {
            position: absolute; bottom: 0; width: 100%; height: 95px; z-index: 100;
            background: rgba(0,0,0,0.98); display: flex; justify-content: space-around;
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #444; font-size: 11px; font-weight: 900; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--neon); text-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>

<div id="render-target"></div>
<div class="cinematic-vignette"></div>

<div class="ui-header">
    <div class="stat"><span class="val" id="gold">148</span><span class="lbl">DEEP COIN</span></div>
    <div class="stat"><span class="val" id="xpoints" style="color:var(--neon)">12</span><span class="lbl">X-POINTS</span></div>
    <div class="stat"><span class="val" style="color:#fff">1</span><span class="lbl">LEVEL</span></div>
</div>

<div class="vault-track">
    <span class="lbl" style="color:var(--gold)">KASA</span>
    <div class="v-bar"><div id="v-fill" class="v-fill"></div></div>
    <span style="font-size:10px; font-weight:900; color:white;">0.01%</span>
</div>

<div class="action-container">
    <button id="castBtn" class="cast-btn" onclick="handleCast()">OLTA AT</button>
    <p style="color:var(--neon); font-size:10px; font-weight:bold; margin-top:20px; letter-spacing:6px;">📍 DEEP SEA RENDER ENGINE</p>
</div>

<div class="nav">
    <div class="nav-item active">🌊 DENİZ</div>
    <div class="nav-item">📈 BORSA</div>
    <div class="nav-item">🏆 RANK</div>
    <div class="nav-item">🏛️ KASA</div>
</div>

<script>
    const tg = window.Telegram.WebApp; tg.expand();
    let scene, camera, renderer, water, boat, captain, clock, sun, rod;
    let gold = 148, xpoints = 12, vaultTL = 10.50, isFishing = false;

    function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x00050a, 0.015);
        clock = new THREE.Clock();

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 15, 45);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('render-target').appendChild(renderer.domElement);

        // ⚓ ULTRA GERÇEKÇİ OKYANUS (Physically Based)
        const waterGeom = new THREE.PlaneGeometry(10000, 10000);
        water = new THREE.Water(waterGeom, {
            textureWidth: 1024, textureHeight: 1024,
            waterNormals: new THREE.TextureLoader().load('https://threejs.org/examples/textures/waternormals.jpg', function(tx){
                tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
            }),
            sunDirection: new THREE.Vector3(), sunColor: 0xffffff, waterColor: 0x001e3c,
            distortionScale: 4.5, fog: scene.fog !== undefined
        });
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // 🌅 SKY ENGINE
        const sky = new THREE.Sky(); sky.scale.setScalar(10000); scene.add(sky);
        sun = new THREE.Vector3();
        const phi = THREE.MathUtils.degToRad(88.8); const theta = THREE.MathUtils.degToRad(180);
        sun.setFromSphericalCoords(1, phi, theta);
        sky.material.uniforms['sunPosition'].value.copy(sun);
        water.material.uniforms['sunDirection'].value.copy(sun).normalize();

        // 🚢 REALISTIC BOAT & CAPTAIN (Living System)
        const boatGroup = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 20), new THREE.MeshStandardMaterial({ color: 0x020202, metalness: 1 }));
        boatGroup.add(hull);

        // Yaşayan Kaptan (3D Detay)
        captain = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0xf1c40f })); // Sarı Ceket
        torso.position.y = 3.5; captain.add(torso);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffdbac })); // Yüz
        head.position.y = 6; captain.add(head);
        
        // Olta
        const rodGeom = new THREE.CylinderGeometry(0.1, 0.2, 15);
        rod = new THREE.Mesh(rodGeom, new THREE.MeshStandardMaterial({ color: 0x111111 }));
        rod.position.set(2, 6, 4); rod.rotation.x = -Math.PI / 4;
        captain.add(rod);

        captain.position.z = -2;
        boatGroup.add(captain);
        boat = boatGroup;
        scene.add(boat);

        // IŞIKLAR
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // 🌊 Su Hareketi
        water.material.uniforms['time'].value += 1.0 / 60.0;

        // 🚢 Gemi Fiziği (Sarsıntı ve Sallanma)
        boat.position.y = Math.sin(t * 1.3) * 0.8 + 0.5;
        boat.rotation.x = Math.sin(t * 0.8) * 0.05;
        boat.rotation.z = Math.cos(t * 1.1) * 0.05;

        // 🧔 Kaptan Canlılığı
        captain.position.y = Math.sin(t * 2) * 0.05; // Nefes
        captain.children[1].rotation.y = Math.sin(t * 0.5) * 0.25; // Etrafa bakma

        // 🎥 Kamera Dinamiği (Realizm)
        camera.position.y = 15 + Math.sin(t * 0.6) * 0.6;
        camera.lookAt(boat.position);

        renderer.render(scene, camera);
    }

    function handleCast() {
        if(isFishing) return;
        isFishing = true;
        tg.HapticFeedback.impactOccurred('heavy');
        const btn = document.getElementById('castBtn');
        btn.disabled = true; btn.innerText = "⚓ BEKLEYİN...";

        // Kamera Sarsıntısı (Sinematik)
        const originalX = camera.position.x;
        let shake = setInterval(() => { camera.position.x = (Math.random()-0.5)*0.6; }, 50);

        setTimeout(() => {
            clearInterval(shake);
            camera.position.x = originalX;
            gold += 25; xpoints += 5; vaultTL += 0.50;
            updateUI();
            btn.disabled = false; btn.innerText = "OLTA AT";
            isFishing = false;
            tg.HapticFeedback.notificationOccurred('success');
        }, 4000);
    }

    function updateUI() {
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('xpoints').innerText = xpoints;
        let prog = (vaultTL / 100000) * 100;
        document.getElementById('v-fill').style.width = Math.min(prog, 100) + "%";
    }

    window.onload = init;
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
